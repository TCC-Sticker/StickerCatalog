<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Collection Book</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #3a1c71 0%, #d76d77 50%, #ffaf7b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            max-width: 1200px;
            width: 100%;
            padding: 20px;
        }
        
        .book-container {
            display: flex;
            justify-content: center;
            perspective: 2500px;
            position: relative;
            height: 600px;
        }
        
        .book {
            position: relative;
            width: 900px;
            height: 100%;
            transform-style: preserve-3d;
            transform: rotateY(-10deg);
            transition: transform 0.5s;
        }
        
        /* Book Cover */
        .cover {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            border-radius: 10px 2px 2px 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #5a3921;
            text-align: center;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            z-index: 10;
            border: 15px solid #8b5a2b;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.2);
            cursor: pointer;
        }
        
        .cover h2 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.1);
            color: #5a2c02;
            font-weight: 800;
            letter-spacing: 2px;
        }
        
        .cover p {
            font-size: 1.4rem;
            max-width: 70%;
            margin: 0 auto 30px;
            color: #5a2c02;
            font-weight: 500;
            line-height: 1.6;
        }
        
        /* Pages */
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: #f8f5f0;
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            padding: 25px;
            backface-visibility: hidden;
            overflow: hidden;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            box-shadow: 
                0 3px 10px rgba(0,0,0,0.1),
                inset 0 0 3px rgba(0,0,0,0.1);
            z-index: 1;
        }
        
        /* Page content styles */
        .page-content {
            display: flex;
            height: 100%;
        }
        
        .left-page, .right-page {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        
        .left-page {
            border-right: 1px dashed #d4c6ad;
        }
        
        .page-number {
            text-align: center;
            font-size: 1.1rem;
            color: #8b5a2b;
            font-weight: bold;
            height: 30px;
            margin-bottom: 10px;
        }
        
        /* Sticker grid */
        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            flex: 1;
        }
        
        .sticker {
            background-color: #f0e6d2;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.08);
            border: 1px solid #e3d9c5;
        }
        
        .sticker img {
            max-width: 85%;
            max-height: 85%;
            opacity: 0.4;
            transition: opacity 0.3s, transform 0.3s;
        }
        
        .sticker.collected img {
            opacity: 1;
            transform: scale(1.05);
        }
        
        .sticker.collected {
            box-shadow: 0 0 0 3px #4caf50;
            background-color: #f5f0e4;
        }
        
        .sticker:hover:not(.collected) img {
            opacity: 0.6;
        }
        
        /* Navigation */
        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 25px;
        }
        
        .nav-btn {
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            border: none;
            padding: 14px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            color: #5a2c02;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 150px;
            justify-content: center;
        }
        
        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        /* Counter */
        .counter {
            color: white;
            font-size: 1.4rem;
            margin-top: 25px;
            background: rgba(0,0,0,0.25);
            padding: 12px 30px;
            border-radius: 30px;
            display: inline-block;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }
        
        /* Decorative elements */
        .ribbon {
            position: absolute;
            top: 15px;
            right: -45px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            color: white;
            padding: 12px 40px;
            font-weight: bold;
            transform: rotate(45deg);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            width: 180px;
            text-align: center;
            font-size: 1.1rem;
            z-index: 20;
        }
        
        .page-edge {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 15px;
            background: repeating-linear-gradient(
                to bottom,
                #f8f5f0,
                #f8f5f0 5px,
                #e0d6c3 5px,
                #e0d6c3 10px
            );
            border-left: 1px solid #d4c6ad;
            z-index: 2;
        }
        
        .book-spine {
            position: absolute;
            left: -10px;
            top: 0;
            height: 100%;
            width: 20px;
            background: linear-gradient(to right, #7a4e2c, #8b5a2b, #7a4e2c);
            border-radius: 2px 0 0 2px;
            box-shadow: inset -3px 0 10px rgba(0,0,0,0.3);
            z-index: 11;
        }
        
        /* Flip states */
        .book.cover-open .cover {
            transform: rotateY(-180deg);
            z-index: 0;
        }
        
        .book.cover-open {
            transform: rotateY(0deg);
        }
        
        .page.flipped {
            transform: rotateY(-180deg);
            z-index: 2;
        }
        
        /* Sticker decorations */
        .sticker::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="none" stroke="%23d4c6ad" stroke-width="1.5" stroke-dasharray="6,3" rx="8"/></svg>');
            opacity: 0.6;
        }
        
        .cover-decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><path d="M40,40 Q100,20 160,40 Q180,100 160,160 Q100,180 40,160 Q20,100 40,40 Z" fill="none" stroke="%238b5a2b" stroke-width="2" stroke-opacity="0.15"/></svg>');
            opacity: 0.3;
            pointer-events: none;
        }
        
        /* Responsive */
        @media (max-width: 950px) {
            .book {
                transform: scale(0.85);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="book-container">
            <div class="book" id="stickerBook">
                <!-- Book spine -->
                <div class="book-spine"></div>
                
                <!-- Front Cover -->
                <div class="cover" id="cover">
                    <div class="cover-decoration"></div>
                    <div class="ribbon">COLLECTOR'S ALBUM</div>
                    <h2>Sticker Treasure</h2>
                    <p>Collect all 123 magical stickers! Click to mark them as collected</p>
                    <div class="sticker-grid">
                        <div class="sticker collected">
                            <img src="https://cdn-icons-png.flaticon.com/128/686/686589.png" alt="Sticker">
                        </div>
                        <div class="sticker">
                            <img src="https://cdn-icons-png.flaticon.com/128/1998/1998665.png" alt="Sticker">
                        </div>
                        <div class="sticker collected">
                            <img src="https://cdn-icons-png.flaticon.com/128/1998/1998742.png" alt="Sticker">
                        </div>
                        <div class="sticker">
                            <img src="https://cdn-icons-png.flaticon.com/128/1998/1998716.png" alt="Sticker">
                        </div>
                        <div class="sticker">
                            <img src="https://cdn-icons-png.flaticon.com/128/1998/1998756.png" alt="Sticker">
                        </div>
                        <div class="sticker collected">
                            <img src="https://cdn-icons-png.flaticon.com/128/1998/1998760.png" alt="Sticker">
                        </div>
                    </div>
                </div>
                
                <!-- Pages will be generated by JavaScript -->
            </div>
        </div>
        
        <div class="navigation">
            <button class="nav-btn" id="prevBtn" disabled>
                <i class="fas fa-arrow-left"></i> Previous Page
            </button>
            <button class="nav-btn" id="nextBtn">
                Next Page <i class="fas fa-arrow-right"></i>
            </button>
        </div>
        
        <div class="counter">
            Collected: <span id="collectedCount">0</span> of 123 stickers
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const stickerBook = document.getElementById('stickerBook');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const collectedCountEl = document.getElementById('collectedCount');
            const cover = document.getElementById('cover');
            
            // Sticker images - replace with your GitHub URLs
            const stickerImages = Array(123).fill().map((_, i) => 
                `https://cdn-icons-png.flaticon.com/128/${1998 + i % 100}/${1998665 + i}.png`
            );
            
            // Total stickers and pages
            const totalStickers = 123;
            const stickersPerPage = 12; // 3x4 grid per page
            const totalPages = Math.ceil(totalStickers / stickersPerPage);
            
            // Current page state
            let currentPage = 0;
            const collectedStickers = JSON.parse(localStorage.getItem('collectedStickers')) || {};
            let collectedCount = Object.keys(collectedStickers).length;
            let coverOpen = false;
            
            // Generate sticker pages
            function generatePages() {
                // Create sticker pages
                for (let i = 0; i < totalPages; i++) {
                    const page = document.createElement('div');
                    page.className = 'page';
                    page.dataset.page = i;
                    
                    // Page edge effect
                    const pageEdge = document.createElement('div');
                    pageEdge.className = 'page-edge';
                    page.appendChild(pageEdge);
                    
                    const pageContent = document.createElement('div');
                    pageContent.className = 'page-content';
                    page.appendChild(pageContent);
                    
                    const leftPage = document.createElement('div');
                    leftPage.className = 'left-page';
                    pageContent.appendChild(leftPage);
                    
                    const rightPage = document.createElement('div');
                    rightPage.className = 'right-page';
                    pageContent.appendChild(rightPage);
                    
                    // Page number
                    const pageNumber = document.createElement('div');
                    pageNumber.className = 'page-number';
                    pageNumber.textContent = `Page ${i + 1}`;
                    rightPage.appendChild(pageNumber);
                    
                    // Create sticker grid for right page (main content)
                    const grid = document.createElement('div');
                    grid.className = 'sticker-grid';
                    rightPage.appendChild(grid);
                    
                    // Calculate sticker range for this page
                    const start = i * stickersPerPage;
                    const end = Math.min(start + stickersPerPage, totalStickers);
                    
                    // Create sticker slots
                    for (let j = start; j < end; j++) {
                        const sticker = document.createElement('div');
                        sticker.className = 'sticker';
                        sticker.dataset.id = j;
                        
                        // Sticker image
                        const img = document.createElement('img');
                        img.src = stickerImages[j];
                        img.alt = `Sticker ${j + 1}`;
                        img.title = `Sticker #${j + 1}`;
                        sticker.appendChild(img);
                        
                        // Check if sticker is collected
                        if (collectedStickers[j]) {
                            sticker.classList.add('collected');
                        }
                        
                        // Add click event
                        sticker.addEventListener('click', function() {
                            toggleSticker(j);
                        });
                        
                        grid.appendChild(sticker);
                    }
                    
                    stickerBook.appendChild(page);
                }
                
                // Position pages for flip animation
                positionPages();
                updateCounter();
            }
            
            // Position pages in 3D space
            function positionPages() {
                const pages = document.querySelectorAll('.page:not(.cover)');
                pages.forEach((page, index) => {
                    page.style.transform = `rotateY(0deg) translateZ(${index * 2}px)`;
                    page.style.zIndex = totalPages - index;
                });
            }
            
            // Toggle sticker collected state
            function toggleSticker(id) {
                if (collectedStickers[id]) {
                    delete collectedStickers[id];
                } else {
                    collectedStickers[id] = true;
                }
                
                collectedCount = Object.keys(collectedStickers).length;
                localStorage.setItem('collectedStickers', JSON.stringify(collectedStickers));
                updateCounter();
                
                // Update sticker UI
                const sticker = document.querySelector(`.sticker[data-id="${id}"]`);
                if (sticker) {
                    sticker.classList.toggle('collected');
                }
            }
            
            // Update collected counter
            function updateCounter() {
                collectedCountEl.textContent = collectedCount;
            }
            
            // Open cover
            function openCover() {
                stickerBook.classList.add('cover-open');
                coverOpen = true;
                setTimeout(() => {
                    updateNavButtons();
                }, 800);
            }
            
            // Flip to next page
            function flipNext() {
                if (!coverOpen) {
                    openCover();
                    return;
                }
                
                if (currentPage < totalPages - 1) {
                    const currentPageEl = document.querySelector(`.page[data-page="${currentPage}"]`);
                    currentPageEl.classList.add('flipped');
                    
                    currentPage++;
                    updateNavButtons();
                }
            }
            
            // Flip to previous page
            function flipPrev() {
                if (currentPage > 0) {
                    const currentPageEl = document.querySelector(`.page[data-page="${currentPage - 1}"]`);
                    currentPageEl.classList.remove('flipped');
                    
                    currentPage--;
                    updateNavButtons();
                }
            }
            
            // Update navigation buttons state
            function updateNavButtons() {
                prevBtn.disabled = currentPage === 0;
                nextBtn.disabled = currentPage === totalPages - 1;
            }
            
            // Event listeners
            cover.addEventListener('click', openCover);
            nextBtn.addEventListener('click', flipNext);
            prevBtn.addEventListener('click', flipPrev);
            
            // Initialize
            generatePages();
            updateNavButtons();
        });
    </script>
</body>
</html>
