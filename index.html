<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sticker Book</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
            padding: 20px;
        }
        
        h1 {
            color: white;
            margin-bottom: 30px;
            font-size: 3.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }
        
        .book-container {
            display: flex;
            justify-content: center;
            perspective: 2000px;
        }
        
        .sticker-book {
            position: relative;
            width: 800px;
            height: 600px;
            transform-style: preserve-3d;
            transition: transform 0.8s;
        }
        
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: #f8f5f0;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            padding: 20px;
            backface-visibility: hidden;
            overflow: hidden;
            border: 1px solid #e0d6c3;
        }
        
        .cover {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            justify-content: center;
            align-items: center;
            color: #5a3921;
            text-align: center;
            z-index: 12;
            border: 15px solid #8b5a2b;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }
        
        .cover h2 {
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.1);
            color: #5a2c02;
        }
        
        .cover p {
            font-size: 1.5rem;
            max-width: 80%;
            margin: 0 auto 30px;
            color: #5a2c02;
            font-weight: 500;
        }
        
        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            flex: 1;
            padding: 20px;
        }
        
        .sticker {
            background-color: #f0e6d2;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        .sticker img {
            max-width: 90%;
            max-height: 90%;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        
        .sticker.collected img {
            opacity: 1;
        }
        
        .sticker.collected {
            box-shadow: 0 0 0 4px #4caf50;
        }
        
        .page-number {
            text-align: center;
            font-size: 1.2rem;
            color: #8b5a2b;
            font-weight: bold;
            height: 30px;
        }
        
        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .nav-btn {
            background: #ff9a9e;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .nav-btn:hover {
            background: #fad0c4;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        
        .nav-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .counter {
            color: white;
            font-size: 1.3rem;
            margin-top: 20px;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 30px;
            display: inline-block;
        }
        
        /* Flip animation */
        .flip-left {
            transform: rotateY(-180deg);
        }
        
        .flip-right {
            transform: rotateY(0deg);
        }
        
        /* Sticker decorations */
        .sticker::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="none" stroke="%23d4c6ad" stroke-width="2" stroke-dasharray="8,4" rx="10"/></svg>');
            opacity: 0.6;
        }
        
        .cover-decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><path d="M40,40 Q100,20 160,40 Q180,100 160,160 Q100,180 40,160 Q20,100 40,40 Z" fill="none" stroke="%238b5a2b" stroke-width="2" stroke-opacity="0.2"/></svg>');
            opacity: 0.3;
        }
        
        .ribbon {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ff6b6b;
            color: white;
            padding: 10px 20px;
            font-weight: bold;
            transform: rotate(45deg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            width: 150px;
            text-align: center;
            right: -40px;
            top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Interactive Sticker Book</h1>
        
        <div class="book-container">
            <div class="sticker-book" id="stickerBook">
                <!-- Cover Page -->
                <div class="page cover">
                    <div class="cover-decoration"></div>
                    <div class="ribbon">NEW COLLECTION</div>
                    <h2>My Sticker Album</h2>
                    <p>Collect all 123 stickers! Click on stickers to mark them as collected</p>
                    <div class="sticker-grid">
                        <!-- Show sample stickers on cover -->
                        <div class="sticker collected">
                            <img src="https://cdn-icons-png.flaticon.com/128/686/686589.png" alt="Sticker">
                        </div>
                        <div class="sticker">
                            <img src="https://cdn-icons-png.flaticon.com/128/1998/1998665.png" alt="Sticker">
                        </div>
                        <div class="sticker collected">
                            <img src="https://cdn-icons-png.flaticon.com/128/1998/1998742.png" alt="Sticker">
                        </div>
                        <div class="sticker">
                            <img src="https://cdn-icons-png.flaticon.com/128/1998/1998716.png" alt="Sticker">
                        </div>
                    </div>
                </div>
                
                <!-- Sticker pages will be generated by JavaScript -->
            </div>
        </div>
        
        <div class="navigation">
            <button class="nav-btn" id="prevBtn" disabled>
                <i class="fas fa-arrow-left"></i> Previous
            </button>
            <button class="nav-btn" id="nextBtn">
                Next <i class="fas fa-arrow-right"></i>
            </button>
        </div>
        
        <div class="counter">
            Collected: <span id="collectedCount">0</span> of 123 stickers
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const stickerBook = document.getElementById('stickerBook');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const collectedCountEl = document.getElementById('collectedCount');
            
            // Sticker images - in a real app, these would be uploaded to GitHub
            const stickerImages = [
                'https://cdn-icons-png.flaticon.com/128/1998/1998665.png',
                'https://cdn-icons-png.flaticon.com/128/1998/1998716.png',
                'https://cdn-icons-png.flaticon.com/128/1998/1998742.png',
                'https://cdn-icons-png.flaticon.com/128/1998/1998756.png',
                'https://cdn-icons-png.flaticon.com/128/1998/1998760.png',
                'https://cdn-icons-png.flaticon.com/128/1998/1998768.png',
                'https://cdn-icons-png.flaticon.com/128/1998/1998772.png',
                'https://cdn-icons-png.flaticon.com/128/1998/1998776.png',
                'https://cdn-icons-png.flaticon.com/128/1998/1998782.png',
                'https://cdn-icons-png.flaticon.com/128/1998/1998796.png',
                'https://cdn-icons-png.flaticon.com/128/1998/1998800.png',
                'https://cdn-icons-png.flaticon.com/128/1998/1998806.png',
                'https://cdn-icons-png.flaticon.com/128/686/686589.png'
            ];
            
            // Total stickers and pages
            const totalStickers = 123;
            const stickersPerPage = 12;
            const totalPages = Math.ceil(totalStickers / stickersPerPage);
            
            // Current page state
            let currentPage = 0;
            const collectedStickers = JSON.parse(localStorage.getItem('collectedStickers')) || {};
            let collectedCount = Object.keys(collectedStickers).length;
            
            // Generate sticker pages
            function generatePages() {
                // Clear existing pages (except cover)
                while (stickerBook.children.length > 1) {
                    stickerBook.removeChild(stickerBook.lastChild);
                }
                
                // Create sticker pages
                for (let i = 0; i < totalPages; i++) {
                    const page = document.createElement('div');
                    page.className = 'page';
                    page.dataset.page = i;
                    
                    const pageNumber = document.createElement('div');
                    pageNumber.className = 'page-number';
                    pageNumber.textContent = `Page ${i + 1} of ${totalPages}`;
                    page.appendChild(pageNumber);
                    
                    const grid = document.createElement('div');
                    grid.className = 'sticker-grid';
                    page.appendChild(grid);
                    
                    // Calculate sticker range for this page
                    const start = i * stickersPerPage;
                    const end = Math.min(start + stickersPerPage, totalStickers);
                    
                    // Create sticker slots
                    for (let j = start; j < end; j++) {
                        const sticker = document.createElement('div');
                        sticker.className = 'sticker';
                        sticker.dataset.id = j;
                        
                        // Random sticker image (in a real app, you would use specific images)
                        const img = document.createElement('img');
                        img.src = stickerImages[Math.floor(Math.random() * stickerImages.length)];
                        img.alt = `Sticker ${j + 1}`;
                        sticker.appendChild(img);
                        
                        // Check if sticker is collected
                        if (collectedStickers[j]) {
                            sticker.classList.add('collected');
                        }
                        
                        // Add click event
                        sticker.addEventListener('click', function() {
                            toggleSticker(j);
                        });
                        
                        grid.appendChild(sticker);
                    }
                    
                    stickerBook.appendChild(page);
                }
                
                // Position pages for flip animation
                positionPages();
                updateCounter();
            }
            
            // Position pages in 3D space
            function positionPages() {
                const pages = document.querySelectorAll('.page:not(.cover)');
                pages.forEach((page, index) => {
                    const pageNum = parseInt(page.dataset.page);
                    
                    if (pageNum < currentPage) {
                        // Pages to the left
                        page.style.transform = `rotateY(180deg) translateZ(${(currentPage - pageNum) * 2}px)`;
                        page.style.zIndex = totalPages - pageNum;
                    } else if (pageNum > currentPage) {
                        // Pages to the right
                        page.style.transform = `rotateY(0deg) translateZ(${(pageNum - currentPage) * 2}px)`;
                        page.style.zIndex = totalPages - pageNum;
                    } else {
                        // Current page
                        page.style.transform = 'rotateY(0deg)';
                        page.style.zIndex = totalPages;
                    }
                });
            }
            
            // Toggle sticker collected state
            function toggleSticker(id) {
                if (collectedStickers[id]) {
                    delete collectedStickers[id];
                } else {
                    collectedStickers[id] = true;
                }
                
                collectedCount = Object.keys(collectedStickers).length;
                localStorage.setItem('collectedStickers', JSON.stringify(collectedStickers));
                updateCounter();
                
                // Update sticker UI
                const sticker = document.querySelector(`.sticker[data-id="${id}"]`);
                if (sticker) {
                    sticker.classList.toggle('collected');
                }
            }
            
            // Update collected counter
            function updateCounter() {
                collectedCountEl.textContent = collectedCount;
            }
            
            // Navigation
            nextBtn.addEventListener('click', function() {
                if (currentPage < totalPages) {
                    currentPage++;
                    stickerBook.classList.add('flip-left');
                    
                    setTimeout(() => {
                        stickerBook.classList.remove('flip-left');
                        positionPages();
                        updateNavButtons();
                    }, 800);
                }
            });
            
            prevBtn.addEventListener('click', function() {
                if (currentPage > 0) {
                    currentPage--;
                    stickerBook.classList.add('flip-right');
                    
                    setTimeout(() => {
                        stickerBook.classList.remove('flip-right');
                        positionPages();
                        updateNavButtons();
                    }, 800);
                }
            });
            
            // Update navigation buttons state
            function updateNavButtons() {
                prevBtn.disabled = currentPage === 0;
                nextBtn.disabled = currentPage === totalPages;
            }
            
            // Initialize
            generatePages();
            updateNavButtons();
        });
    </script>
</body>
</html>
